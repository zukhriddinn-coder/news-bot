name: OptionWhales probe

on:
  workflow_dispatch:            # one-off test: Actions -> OptionWhales probe -> Run workflow
    inputs:
      ticker:
        description: "Ticker, e.g. NVDA"
        required: false
        default: "NVDA"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe the OptionWhales API
        run: python ow_probe.py
        env:
          OW_API_KEY: ${{ secrets.OW_API_KEY }}
          TICKER: ${{ inputs.ticker }}

name: Buffet AI daily scanner

on:
  workflow_dispatch:            # started twice every trading day by Google Apps Script (scanner.gs),
                                # or by hand: Actions -> Buffet AI daily scanner -> Run workflow
    inputs:
      mode:
        description: "morning (10:00 New York) or close (15:00 New York)"
        required: false
        default: "close"
      force:
        description: "Run now even outside the scan time (test)"
        required: false
        default: "true"

permissions:
  contents: write               # the waiting list (watchlist.json) is saved to the repo

concurrency:
  group: buffet-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/scanner.yml

      - name: Install
        run: pip install yfinance matplotlib lxml

      - name: Scan the market and post candidates
        run: python scanner.py
        env:
          BUFFET_BOT_TOKEN: ${{ secrets.BUFFET_BOT_TOKEN }}
          BUFFET_CHAT_ID: ${{ secrets.BUFFET_CHAT_ID }}
          BUFFET_THREAD_ID: ${{ secrets.BUFFET_THREAD_ID }}
          FORCE: ${{ inputs.force }}
          MODE: ${{ inputs.mode }}

      - name: Save the waiting list
        run: |
          [ -f watchlist.json ] || exit 0
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add watchlist.json
          if ! git diff --cached --quiet; then
            git commit -m "Buffet AI waiting list"
            git pull --rebase
            git push
          fi

name: Buffet AI daily scanner

on:
  workflow_dispatch:            # started every trading day at 10:00 New York by Google Apps Script (scanner.gs),
                                # or by hand: Actions -> Buffet AI daily scanner -> Run workflow
    inputs:
      force:
        description: "Run now even outside 10:00 New York (test)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: buffet-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/scanner.yml

      - name: Install
        run: pip install yfinance matplotlib lxml

      - name: Scan the market and post candidates
        run: python scanner.py
        env:
          BUFFET_BOT_TOKEN: ${{ secrets.BUFFET_BOT_TOKEN }}
          BUFFET_CHAT_ID: ${{ secrets.BUFFET_CHAT_ID }}
          BUFFET_THREAD_ID: ${{ secrets.BUFFET_THREAD_ID }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}

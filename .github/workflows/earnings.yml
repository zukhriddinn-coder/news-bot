name: Hisobotlar kalendari

on:
  workflow_dispatch:            # started twice every trading day by Google Apps Script (earnings.gs):
                                # 03:00 New York (mode pre) and 15:00 New York (mode post),
                                # or by hand: Actions -> Hisobotlar kalendari -> Run workflow
    inputs:
      mode:
        description: "pre = before the open (03:00 NY), post = after the close (15:00 NY), empty = by the clock"
        required: false
        default: ""
      force:
        description: "Run now even outside the posting time (test)"
        required: false
        default: "true"
      day:
        description: "Preview another day, YYYY-MM-DD (empty = today)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: earnings-calendar
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/earnings.yml

      - name: Install
        run: pip install yfinance matplotlib lxml

      - name: Post the earnings calendar
        run: python earnings.py
        env:
          EARN_BOT_TOKEN: ${{ secrets.EARN_BOT_TOKEN }}
          EARN_CHAT_ID: ${{ secrets.EARN_CHAT_ID }}
          EARN_THREAD_ID: ${{ secrets.EARN_THREAD_ID }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FORCE: ${{ inputs.force }}
          DAY: ${{ inputs.day }}
          MODE: ${{ inputs.mode }}
